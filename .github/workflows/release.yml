name: Release JAR

on:
  release:
    types: [created]
permissions:
  contents: write

jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'zulu'

      - name: Build with Maven
        run: |
          cd ./ReservApp
          mvn clean package -DskipTests
      - name: Extraer versión del pom.xml
        id: get_version
        run: |
          cd ./ReservApp
          echo "VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)" >> $GITHUB_ENV
