name: Release JAR

on:
  release:
    types: [created]

jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'zulu'

      - name: Build with Maven
        run: mvn clean package

      - name: Rename JAR with release version
        run: mv target/TFG-ReservApp.jar target/TFG-ReservApp-${{ github.event.release.tag_name }}.jar

      - name: Upload JAR to Release
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ github.event.release.upload_url }}
          asset_path: ./target/TFG-ReservApp-${{ github.event.release.tag_name }}.jar
          asset_name: TFG-ReservApp-${{ github.event.release.tag_name }}.jar
          asset_content_type: application/java-archive
