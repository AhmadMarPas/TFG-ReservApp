name: Release JAR

on:
  release:
    types: [created]

jobs:
  upload-jar-to-release:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar artefacto JAR del workflow de build
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts

      - name: Obtener versión del pom.xml
        id: get_version
        run: |
          VERSION=$(mvn -f ReservApp/pom.xml help:evaluate -Dexpression=project.version -q -DforceStdout)
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Renombrar JAR para la release
        run: |
          mv reservApp-$VERSION.jar ReservApp-${{ github.event.release.tag_name }}.jar

      - name: Subir JAR a la release
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ github.event.release.upload_url }}
          asset_path: ReservApp-${{ github.event.release.tag_name }}.jar
          asset_name: ReservApp-${{ github.event.release.tag_name }}.jar
          asset_content_type: application/java-archive
